name: Film Arşivini Güncelle

on:
  schedule:
    - cron: '0 0 */4 * *'  # Her 4 günde bir 00:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Push izni için önemli

    steps:
    - name: Kodu klonla
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Node.js kur
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Bağımlılıkları yükle
      run: npm install axios

    - name: Filmleri çek
      env:
        TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      run: node scrape.js

    - name: Değişiklikleri commit ve push et
      run: |
        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        
        # Git durumunu kontrol et, eklenen/değişen dosya var mı?
        git status
        
        # Uzaktaki olası değişiklikleri al (Rebase yerine merge kullanarak çakışmaları azaltır)
        git pull origin main --no-rebase || true
        
        # Sadece ilgili dosyaları ekle
        git add filmler/*.m3u
        
        # Eğer commit edilecek değişiklik varsa commit et ve pushla
        git diff --cached --quiet || git commit -m "Update movies $(date +'%Y-%m-%d %H:%M')"
        git push origin main
